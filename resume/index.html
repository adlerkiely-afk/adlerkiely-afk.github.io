<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume · Adler Kiely</title>
<meta name="description" content="Resume of Adler Kiely, aerospace engineering student at Kent State University, seeking a summer 2027 internship.">
<meta property="og:type" content="article">
<meta property="og:title" content="Adler Kiely · Resume">
<meta property="og:description" content="Aerospace engineering student at Kent State University (4.0 GPA). Payload Subsection Lead, Kent State Rocket Team. Seeking a summer 2027 internship.">
<meta property="og:image" content="https://adlerkiely-afk.github.io/images/wiref.png">
<meta property="og:url" content="https://adlerkiely-afk.github.io/resume/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/tokens.css">
<script>document.documentElement.classList.add('js');try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
  *,*::before,*::after{box-sizing:border-box}
  html{color-scheme:dark;-webkit-text-size-adjust:100%}
  :root[data-theme="light"]{color-scheme:light}
  body{margin:0;background:var(--bg);color:var(--text);font:400 16px/26px var(--sans);-webkit-font-smoothing:antialiased}
  h1,p{margin:0}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  ::selection{background:var(--accent);color:var(--accent-ink)}
  .wrap{width:100%;max-width:1200px;margin:0 auto;padding:0 32px}
  .meta{font:400 12px/16px var(--mono);color:var(--text-3)}
  .ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

  /* header */
  .top{position:sticky;top:0;z-index:40;height:64px;background:var(--bg);border-bottom:1px solid var(--line)}
  .top .wrap{display:flex;align-items:center;gap:8px;height:100%}
  .brand{display:flex;align-items:baseline;gap:12px;margin-right:auto;text-decoration:none}
  .brand b{font: 600 16px/24px var(--display)}
  .brand span{font:400 12px/16px var(--mono);color:var(--text-3)}
  .icon-btn{display:grid;place-items:center;width:36px;height:36px;padding:0;border:0;border-radius:var(--r-ctl);background:none;color:var(--text-2);cursor:pointer;transition:color var(--fast) var(--ease),background-color var(--fast) var(--ease)}
  .icon-btn:hover{color:var(--text);background:var(--raised)}
  .tog .moon{display:none}
  :root[data-theme="light"] .tog .sun{display:none}
  :root[data-theme="light"] .tog .moon{display:block}
  html:not(.js) .tog{display:none}

  /* buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border:1px solid var(--btn-bg);border-radius:var(--r-ctl);background:var(--btn-bg);color:var(--btn-text);font:500 16px/24px var(--sans);text-decoration:none;white-space:nowrap;transition:background-color var(--fast) var(--ease),border-color var(--fast) var(--ease),transform var(--fast) var(--ease)}
  .btn:hover{background:color-mix(in srgb,var(--btn-bg) 86%,var(--bg));border-color:color-mix(in srgb,var(--btn-bg) 86%,var(--bg))}
  .btn:active{transform:scale(.98)}
  .btn.alt{background:var(--raised);border-color:var(--line-2);color:var(--text)}
  .btn.alt:hover{background:color-mix(in srgb,var(--raised) 92%,var(--text));border-color:var(--text-3)}
  .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}

  /* page */
  main{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:32px 48px;align-items:start;padding-top:48px;padding-bottom:48px}
  h1{margin-top:12px;font: 700 28px/32px var(--display);letter-spacing:-0.01em}
  iframe{display:block;width:100%;height:min(1100px,calc(100svh - 160px));min-height:480px;border:1px solid var(--line);border-radius:var(--r-card);background:var(--card)}

  @media (max-width:959px){
    .wrap{padding:0 20px}
    .brand span{display:none}
    main{grid-template-columns:minmax(0,1fr);padding-top:32px;padding-bottom:32px}
  }
  @media print{
    .top,.actions{display:none}
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
  <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>
</defs></svg>

<header class="top"><div class="wrap">
  <a class="brand" href="../"><b>Adler Kiely</b><span>Engineering portfolio</span></a>
  <button class="icon-btn tog" id="tog" type="button" aria-label="Switch between light and dark theme"><svg class="ic sun" aria-hidden="true"><use href="#i-sun"/></svg><svg class="ic moon" aria-hidden="true"><use href="#i-moon"/></svg></button>
</div></header>

<main class="wrap">
  <div>
    <p class="meta">Adler Kiely · Aerospace engineering, Kent State University</p>
    <h1>Resume</h1>
    <div class="actions"><a class="btn" href="Adler_Kiely_Resume.pdf"><svg class="ic" aria-hidden="true"><use href="#i-download"/></svg>Download PDF</a><a class="btn alt" href="../"><svg class="ic" aria-hidden="true"><use href="#i-arrow-left"/></svg>Portfolio</a></div>
  </div>
  <iframe src="Adler_Kiely_Resume.pdf" title="Adler Kiely resume"></iframe>
</main>

<script>
document.getElementById('tog').addEventListener('click',function(){
  var r=document.documentElement,n=r.dataset.theme==='light'?'dark':'light';
  r.dataset.theme=n;
  try{localStorage.setItem('theme',n);}catch(e){}
});
</script>
</body>
</html>
